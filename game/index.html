<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Void Survivor: Protocol Zero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #05060b; color: #e0f2fe; font-family: monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #game-container { position: relative; width: 1280px; height: 720px; box-shadow: 0 0 50px rgba(14, 165, 233, 0.25); border: 1px solid rgba(56, 189, 248, 0.3); overflow: hidden; background: #070913; }
    canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <div class="scanlines"></div>
  </div>
  <script type="module" src="./game.js"></script>
</body>
</html>
