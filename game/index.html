<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Void Survivor: Protocol Zero</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070913;
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.15), 0 0 20px rgba(129, 140, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 4px;
      overflow: hidden;
      background: #02040a;
    }

    #game-canvas {
      display: block;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background-color: #05070f;
      cursor: crosshair;
    }

    /* Subtle CRT Scanline and Vignette effect */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                  radial-gradient(circle at center, transparent 65%, rgba(2, 4, 10, 0.6) 100%);
      background-size: 100% 4px, 100% 100%;
      opacity: 0.65;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <div class="crt-overlay"></div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
